version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hospital_queue_db
    restart: always
    environment:
      MYSQL_DATABASE: hospital_queue_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./queue-backend
      dockerfile: Dockerfile
    container_name: hospital_queue_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/hospital_queue_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
    depends_on:
      - db

  frontend:
    build:
      context: ./hospital-frontend
      dockerfile: Dockerfile
    container_name: hospital_queue_frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db_data:
